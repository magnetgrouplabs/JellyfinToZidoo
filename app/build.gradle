        release {
            def ksPath = System.getenv("JF2Z_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("JF2Z_KEYSTORE_PASSWORD")
                keyAlias System.getenv("JF2Z_KEY_ALIAS")
                keyPassword System.getenv("JF2Z_KEY_PASSWORD")
